<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;display=swap');
    </style>
    <!-- Indigo glow filter for output node -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle drop shadow for whole mark -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ── AMBIENT GLOW BEHIND ICON ──────────────────────── -->
  <circle cx="88" cy="90" r="72" fill="#4338ca" opacity="0.07"/>
  <circle cx="88" cy="90" r="48" fill="#6366f1" opacity="0.07"/>

  <!-- ── EDGE LINES (DAG arrows) ────────────────────────── -->
  <!-- A → B (top) -->
  <line x1="54" y1="82" x2="88" y2="53" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- A → C (bottom) -->
  <line x1="54" y1="98" x2="88" y2="127" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- B → D -->
  <line x1="101" y1="55" x2="122" y2="82" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- C → D -->
  <line x1="101" y1="125" x2="122" y2="98" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

  <!-- Arrowheads -->
  <!-- A→B arrowhead -->
  <polyline points="80,48 88,53 82,60" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- A→C arrowhead -->
  <polyline points="80,132 88,127 82,120" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- B→D arrowhead -->
  <polyline points="116,78 122,82 115,89" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- C→D arrowhead -->
  <polyline points="116,102 122,98 115,91" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- ── NODES ───────────────────────────────────────────── -->

  <!-- Node A (left / start) -->
  <circle cx="46" cy="90" r="22" fill="#0d0b2a" stroke="#6366f1" stroke-width="1.8"/>
  <circle cx="46" cy="90" r="8" fill="#6366f1"/>

  <!-- Node B (top) -->
  <circle cx="90" cy="46" r="19" fill="#0d0b2a" stroke="#6366f1" stroke-width="1.6"/>
  <circle cx="90" cy="46" r="7" fill="#6366f1"/>

  <!-- Node C (bottom) -->
  <circle cx="90" cy="134" r="19" fill="#0d0b2a" stroke="#6366f1" stroke-width="1.6"/>
  <circle cx="90" cy="134" r="7" fill="#6366f1"/>

  <!-- Node D (output — violet, prominent) -->
  <circle cx="132" cy="90" r="26" fill="#0f0a32" stroke="#9333ea" stroke-width="2.4" filter="url(#glow)"/>
  <circle cx="132" cy="90" r="10" fill="#9333ea"/>

  <!-- ── DIVIDER ──────────────────────────────────────────── -->
  <line x1="172" y1="38" x2="172" y2="142" stroke="#6366f1" stroke-width="0.7" opacity="0.22"/>

  <!-- ── WORDMARK ─────────────────────────────────────────── -->
  <!-- "Workflow" -->
  <text
    x="192" y="101"
    font-family="'Syne', 'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#dde2ff"
    letter-spacing="-0.8"
  >Workflow</text>

  <!-- "ORCHESTRATOR" -->
  <text
    x="194" y="124"
    font-family="'Syne', 'Segoe UI', Arial, sans-serif"
    font-size="11.5"
    font-weight="700"
    fill="#7c87d4"
    letter-spacing="5.5"
  >ORCHESTRATOR</text>

</svg>
